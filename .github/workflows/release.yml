name: Release

# Publishes to npm when a version tag (e.g. v1.0.0) is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check tag matches package.json version
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi
      - name: Use npm 11 (required for trusted publishing)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Uses npm Trusted Publishing (OIDC) when configured; otherwise falls back to the NPM_TOKEN secret.
      - run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
